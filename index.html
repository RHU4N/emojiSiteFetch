<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji o site</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <header class="header">
            <div>
                <span class="eyebrow">EMOJI HUB</span>
                <h1>Encontre seu emoji</h1>
                <p>Pesquise, filtre e copie emojis de forma rápida.</p>
            </div>
        </header>

        <section class="controle">
            <div class="pesquisar">
                <input id="searchInput" type="search" placeholder="Pesquisar emoji por nome...">
                <button class="btn-p" onclick="searchEmoji()">Pesquisar</button>
            </div>

            <button class="rdm-btn" onclick="randomEmoji()">
                <span>🎲</span>
                Emoji aleatório
            </button>

            <div class="filtros">
                <div class="filtro-group">
                    <label for="catSelect">Categoria</label>
                    <select id="catSelect">
                        <option value="">Selecione uma categoria</option>
                    </select>
                    <button onclick="fetchCategory()">Buscar Categoria</button>
                </div>

                <div class="filtro-group">
                    <label for="gpSelect">Grupo</label>
                    <select id="gpSelect">
                        <option value="">Selecione um grupo</option>
                    </select>

                    <button onclick="fetchGroup()">Buscar Grupo</button>

                </div>


            </div>

            <button class="all-btn" onclick="tudo()">Mostrar Todos</button>
        </section>

    </main>


    <div id="emoji">

    </div>

    <script src="js/script.js"></script>
</body>

</html>
